name: Verify deployed MCP

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "lib/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/verify-deployment.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Verify production MCP and transcript tool
        run: npm run verify:deployment
        env:
          MCP_URL: https://youtube-transcript-mcp-peach.vercel.app/mcp
          TEST_VIDEO_URL: https://www.youtube.com/watch?v=qsjc7kfWffw

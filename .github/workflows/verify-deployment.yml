name: Verify deployed MCP

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "lib/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/verify-deployment.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Mark transcript verification pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "MCP Transcript Test",
              description: "Waiting for deployment and transcript verification"
            });

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Verify production MCP and transcript tool
        run: npm run verify:deployment
        env:
          MCP_URL: https://youtube-transcript-mcp-peach.vercel.app/mcp
          TEST_VIDEO_URL: https://www.youtube.com/watch?v=qsjc7kfWffw

      - name: Mark transcript verification successful
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "success",
              context: "MCP Transcript Test",
              description: "Tool list and live transcript retrieval succeeded"
            });

      - name: Mark transcript verification failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "failure",
              context: "MCP Transcript Test",
              description: "Live transcript verification failed"
            });
